<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/logo_transparent.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/logo_transparent.png?v=2" />
    <link rel="apple-touch-icon" href="/images/logo_transparent.png?v=2" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f8cff" />
    <meta name="description" content="Local-first, privacy-first developer productivity suite executing entirely in your browser with zero remote transmission." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DevVault — Developer Productivity Platform</title>

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DevVault — Developer Productivity Platform" />
    <meta property="og:description" content="Local-first, privacy-first developer utility suite with 29 client-side tools executing entirely in your browser with zero remote transmission." />
    <meta property="og:image" content="/images/banner_dark.png" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DevVault — Developer Productivity Platform" />
    <meta name="twitter:description" content="Local-first, privacy-first developer utility suite with 29 client-side tools executing entirely in your browser with zero remote transmission." />
    <meta name="twitter:image" content="/images/banner_dark.png" />
    <!-- Prevent theme and font size flash -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('devvault-theme');
          const theme = stored ? JSON.parse(stored).state?.theme || 'system' : 'system';
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (theme === 'system' && systemDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        }

        try {
          const storedFont = localStorage.getItem('devvault-font-size');
          const fontSize = storedFont ? JSON.parse(storedFont).state?.fontSize || 'normal' : 'normal';
          const fontMap = { small: '12px', normal: '14px', large: '16px', xlarge: '18px' };
          if (fontMap[fontSize]) {
            document.documentElement.style.fontSize = fontMap[fontSize];
            document.documentElement.setAttribute('data-font-size', fontSize);
          } else {
            document.documentElement.style.fontSize = '14px';
          }
        } catch (e) {
          document.documentElement.style.fontSize = '14px';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background text-foreground antialiased min-h-screen selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
